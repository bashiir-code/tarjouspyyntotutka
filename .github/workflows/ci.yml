name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: az bicep build --file infra/main.bicep

  eval:
    # Runs the 30-query retrieval eval against the live index; fails if recall@5 regresses.
    runs-on: ubuntu-latest
    env:
      FOUNDRY_ENDPOINT: ${{ secrets.FOUNDRY_ENDPOINT }}
      FOUNDRY_API_KEY: ${{ secrets.FOUNDRY_API_KEY }}
      SEARCH_ENDPOINT: ${{ secrets.SEARCH_ENDPOINT }}
      SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
      SEARCH_INDEX: hilma-notices
      CHAT_DEPLOYMENT: gpt-5-mini
      EMBEDDING_DEPLOYMENT: text-embedding-3-small
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run python eval/run_eval.py --min-recall 0.8
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-results, path: eval/results.json }
